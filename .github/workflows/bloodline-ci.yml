name: BloodLine CI
on:
  push:
  pull_request:
  workflow_call:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: code/backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: code/backend/requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - name: Migrations apply to an empty database
        run: DATABASE_URL=sqlite:///./ci-migrate.db alembic upgrade head
  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bloodline-api ./code/backend
