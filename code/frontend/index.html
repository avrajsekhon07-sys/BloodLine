.bellw{position:relative}.badge{position:absolute;top:-6px;right:-6px;background:var(--crit);color:#fff;border-radius:99px;font-size:10px;padding:1px 6px;font-weight:700}.bellbox{position:absolute;right:0;top:46px;width:330px;max-height:380px;overflow:auto;background:var(--s);border:1px solid var(--ln);border-radius:12px;box-shadow:0 14px 44px rgba(0,0,0,.45);padding:8px;z-index:15;animation:rise .2s both}.bellbox a{display:block;padding:9px 10px;border-radius:8px;color:inherit;text-decoration:none;font-size:13px;border-left:3px solid var(--warn);margin-bottom:4px}.bellbox a.HIGH{border-color:var(--crit)}.bellbox a.LOW{border-color:var(--ok)}.bellbox a:hover{background:var(--soft)}
.donorhero{display:flex;align-items:center;gap:26px;flex-wrap:wrap}.donorhero .dropsvg{width:96px;height:116px}.tl{display:grid;gap:14px;border-left:2px solid var(--ln);padding-left:18px;margin-left:4px}.tl div{position:relative;display:flex;justify-content:space-between}.tl i{position:absolute;left:-25px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--pri);box-shadow:0 0 0 4px var(--soft)}

<script src="viz.js"></script>
<script>
// Demo convenience: pre-fills the login form and shows one-click demo accounts. Set to false for any real deployment.
const DEMO=true,DEMO_PW="bloodline123",DEMO_USERS=[["Manager","manager"],["Inventory staff","inventory"],["Medical staff","screening"],["Hospital","hospital"],["Admin","admin"]];
const API=localStorage.getItem("bl_api")||"http://localhost:8000",BG=["A+","A-","B+","B-","AB+","AB-","O+","O-"],LOW=15;
const $=(s,r=document)=>r.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pill=(t,c)=>`<span class="p ${c??t}">${esc(t)}</span>`,fmt=d=>d?new Date(d).toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"}):"—",nm=s=>String(s).replace(/_/g," ");
let S={};try{S=JSON.parse(sessionStorage.bl||"{}")}catch(e){}
const save=()=>{try{sessionStorage.bl=JSON.stringify(S)}catch(e){}};
function toast(m,e){const t=document.createElement("div");t.className="t"+(e?" e":"");t.textContent=m;$("#toast").append(t);setTimeout(()=>t.remove(),3800)}
async function api(p,o={}){const h={};if(S.token)h.Authorization="Bearer "+S.token;if(o.body)h["Content-Type"]="application/json";
 const r=await fetch(API+p,{...o,headers:h});if(r.status==401&&S.token){S={};save();location.hash="";render();throw Error("Session expired")}
 if(!r.ok){const j=await r.json().catch(()=>({}));throw Error(typeof j.detail=="string"?j.detail:"Request failed ("+r.status+")")}return r.json()}
const post=(p,b)=>api(p,{method:"POST",body:b&&JSON.stringify(b)});
/* theme */
function theme(t){if(!t){try{t=localStorage.bl_t}catch(e){}t=t||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")}
 document.documentElement.dataset.t=t;try{localStorage.bl_t=t}catch(e){}}
theme();
/* charts (inline SVG) */
function bars(rows){const W=520,H=190,m=26,max=Math.max(1,...rows.flatMap(r=>[r.a,r.b])),bw=W/rows.length;
 return `<svg viewBox="0 0 ${W} ${H+20}" width="100%" role="img" aria-label="Current stock versus forecast demand by blood group">${rows.map((r,i)=>{const x=i*bw+6,h1=r.a/max*(H-m),h2=r.b/max*(H-m);
 return `<rect x="${x}" y="${H-h1}" width="${bw/2-8}" height="${h1}" rx="3" fill="var(--pri)"><title>${r.l} stock ${r.a}</title></rect><rect x="${x+bw/2-6}" y="${H-h2}" width="${bw/2-8}" height="${h2}" rx="3" fill="var(--warn)" opacity=".85"><title>${r.l} forecast ${r.b}</title></rect><text x="${x+bw/2-6}" y="${H+14}" text-anchor="middle" font-size="11" fill="var(--mut)">${r.l}</text>`}).join("")}</svg>
 <div class="sm mut row"><span style="color:var(--pri)">■</span>Current stock<span style="color:var(--warn)">■</span>7-day forecast</div>`}
function line(v){const W=560,H=150,mx=Math.max(...v,1),mn=Math.min(...v,0),p=v.map((y,i)=>`${i/(v.length-1||1)*W},${H-(y-mn)/(mx-mn||1)*(H-8)-4}`).join(" ");
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Daily demand"><polyline points="${p}" fill="none" stroke="var(--pri)" stroke-width="2"/></svg>`}
/* notification bell: built only from real data for the signed-in role */
let _al={t:0,k:"",v:[]};
async function alerts(){if(Date.now()-_al.t<20000&&_al.k==S.role+S.bank)return _al.v;const o=[];try{
 if(["blood_bank_manager","system_admin"].includes(S.role)){const [r,q]=await Promise.all([api("/risk/"+await bank()),api("/requests?status=pending")]);r.filter(x=>x.risk_level=="HIGH").forEach(x=>o.push({t:`${x.blood_group} is high risk: stock ${x.current_stock}, forecast ${x.predicted_demand}`,h:"#/risk",l:"HIGH"}));if(q.length)o.push({t:`${q.length} hospital request(s) waiting for review`,h:"#/requests",l:"MODERATE"})}
 else if(S.role=="inventory_staff"){(await api("/units/expiring?days=7&blood_bank_id="+await bank())).forEach(x=>o.push({t:`${x.units} ${x.blood_group} unit(s) ${x.overdue?"past expiry":"expire in "+x.days_left+" d"}`,h:"#/inventory",l:x.overdue?"HIGH":"MODERATE"}))}
 else if(S.role=="donor"){(await api("/notifications/me")).filter(n=>!n.was_read).forEach(n=>o.push({t:n.message,h:"#/donor",l:"MODERATE"}))}
 else if(S.role=="hospital_coordinator"){(await api("/hospital/requests")).filter(r=>r.status!="pending").slice(0,5).forEach(r=>o.push({t:`${r.quantity_units} × ${r.blood_group} request ${r.status}`,h:"#/hospital",l:r.status=="fulfilled"?"LOW":"HIGH"}))}
 else if(S.role=="medical_staff"){const n=(await api("/screening/candidates")).filter(x=>!x.last_screening_outcome&&x.cooldown_cleared&&x.is_available).length;if(n)o.push({t:`${n} donor(s) awaiting screening`,h:"#/screening",l:"MODERATE"})}}catch(e){}
 _al={t:Date.now(),k:S.role+S.bank,v:o};return o}
/* shared bits */
function dlg(html){return new Promise(ok=>{const d=document.createElement("dialog");d.innerHTML=html;document.body.append(d);d.showModal();d.addEventListener("close",()=>{ok(d.returnValue&&d.returnValue!="cancel"?new FormData(d.querySelector("form")):null);d.remove()})})}
const confirmBox=(m)=>dlg(`<form method="dialog"><h2>Please confirm</h2><p class="mut" style="margin-bottom:16px">${esc(m)}</p><div class="row sp"><button class="b gh" value="cancel">Cancel</button><button class="b" value="ok">Confirm</button></div></form>`);
async function bank(){if(!S.bank){const b=await api("/regional/banks");S.bank=b[0]?.id;save()}return S.bank}

 alerts().then(a=>{const bd=$("#bd"),bb=$("#bb");if(!bd)return;bd.hidden=!a.length;bd.textContent=a.length;bb.innerHTML=a.length?a.map(x=>`<a class="${x.l}" href="${x.h}">${esc(x.t)}</a>`).join(""):`<div class="empty" style="padding:16px">You’re all caught up.</div>`;
  $("#bell").onclick=e=>{e.stopPropagation();bb.hidden=!bb.hidden;$("#bell").setAttribute("aria-expanded",!bb.hidden)};bb.onclick=()=>bb.hidden=true});
 $("#kb").onclick=palette;
 $("#th").onclick=()=>theme(document.documentElement.dataset.t=="dark"?"light":"dark");$("#lo").onclick=()=>{S={};save();location.hash="";render()};
 try{await P[pg]($("#c"));V.count($("#c"))}catch(e){$("#c").innerHTML=`<div class="card empty">${esc(e.message)}</div>`}}
function palette(){const items=[...(NAV[S.role]||[]).map(n=>({t:"Go to "+n[1],a:()=>location.hash="#/"+n[0]})),{t:"Toggle light / dark theme",a:()=>theme(document.documentElement.dataset.t=="dark"?"light":"dark")},{t:"Sign out",a:()=>{S={};save();location.hash="";render()}}];
 const d=document.createElement("dialog");d.className="pal";d.innerHTML=`<input id="pq" placeholder="Type a command…  (↑ ↓ Enter)" aria-label="Command"><div id="pl"></div>`;document.body.append(d);d.showModal();let i=0,list=items;
 const draw=()=>{$("#pl",d).innerHTML=list.map((x,k)=>`<div class="pi ${k==i?"on":""}" data-k="${k}">${esc(x.t)}</div>`).join("")||`<div class="empty">No matches</div>`},run=k=>{const x=list[k];d.close();if(x)x.a()};
 $("#pq",d).oninput=e=>{list=items.filter(x=>x.t.toLowerCase().includes(e.target.value.toLowerCase()));i=0;draw()};
 d.onkeydown=e=>{if(e.key=="ArrowDown"){i=Math.min(i+1,list.length-1);draw();e.preventDefault()}else if(e.key=="ArrowUp"){i=Math.max(i-1,0);draw();e.preventDefault()}else if(e.key=="Enter")run(i)};
 d.onclick=e=>{const p=e.target.closest(".pi");if(p)run(+p.dataset.k);else if(e.target==d)d.close()};d.onclose=()=>d.remove();draw()}
addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()=="k"&&S.token){e.preventDefault();if(!$(".pal"))palette()}});
addEventListener("hashchange",render);addEventListener("click",()=>{const b=$("#bb");if(b)b.hidden=true});render();
